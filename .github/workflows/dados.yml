# .github/workflows/dados.yml
# Atualiza o catálogo e as fotos de rua (/dados/linhas.json e /dados/fotos-de-rua.json): o catálogo à segunda-feira de
# manhã, as fotos na primeira segunda-feira do mês. Só corre depois de o autor pôr a variável do repositório
# SERVIDOR_PUBLICADO = sim, só no main, só com o último commit que o "Servidor" já publicou (nunca código que o autor
# ainda não publicou) e só quando algum dos dois mudou. Ver docs/servidor.md.
name: Dados

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Least privilege: ler o código e as corridas do workflow Servidor.
permissions:
  contents: read
  actions: read

# O mesmo grupo do job "publicar" do servidor.yml: este workflow e uma publicação nunca correm ao mesmo tempo, e
# nenhum cancela o outro a meio.
concurrency:
  group: publicar-servidor
  cancel-in-progress: false

jobs:
  linhas:
    name: Weekly lines catalogue and street photos
    if: github.ref == 'refs/heads/main' && vars.SERVIDOR_PUBLICADO == 'sim'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # O commit da última corrida à mão do "Servidor" no main, e só se ela acabou bem (a que publicou). Se a última
      # falhou, foi cancelada ou ainda corre, pára: um "publicar" que falhou a meio nunca é desfeito por este deploy de
      # um commit antigo. Como os dois partilham o grupo de concorrência, nada publica entre este passo e o deploy.
      - name: Find the last published commit
        id: publicado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ultima=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow servidor.yml --branch main --event workflow_dispatch \
            --limit 1 --json headSha,conclusion)
          sha=$(jq -r '.[0].headSha // empty' <<< "$ultima")
          conclusao=$(jq -r '.[0].conclusion // empty' <<< "$ultima")
          if [ -z "$sha" ]; then
            echo "::error::O servidor ainda não foi publicado pelo workflow Servidor; não há nada para atualizar."
            exit 1
          fi
          if [ "$conclusao" != "success" ]; then
            echo "::error::A última corrida à mão do Servidor no main não acabou bem (${conclusao:-ainda a correr}); corre-a outra vez antes de atualizar o catálogo."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.publicado.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies (exact versions from package-lock.json)
        working-directory: worker
        run: npm ci

      # Os mesmos passos do "Servidor"; aqui uma falha pára tudo e o catálogo que está no ar fica.
      - name: Generate the lines catalogue from Transitous
        shell: bash
        working-directory: worker
        env:
          UA: 'ParagemCerta/0.4.0 (contact@pixellusitano.com; https://pixellusitano.com)'
        run: |
          gtfs="$RUNNER_TEMP/gtfs"
          mkdir -p "$gtfs"
          jq -r '.[] | [.feed, .url] | @tsv' ferramentas/feeds-linhas.json | while IFS=$'\t' read -r feed url; do
            curl -fsSL --retry 2 -A "$UA" -o "$RUNNER_TEMP/feed.zip" "$url"
            unzip -q -o "$RUNNER_TEMP/feed.zip" -d "$gtfs/$feed"
          done
          node ferramentas/gerar-linhas.mjs "$gtfs" public/dados/linhas.json

      # Corre todas as semanas porque um deploy apaga do ar o que não leva: o gerador decide se gera ou copia o que lá está.
      # Com o agendamento gera nos dias 1 a 7 do mês; à mão gera sempre. Uma falha do Panoramax não pára nada.
      - name: Get the street photos
        working-directory: worker
        env:
          MODO: ${{ github.event_name == 'workflow_dispatch' && 'sempre' || 'mensal' }}
        run: node ferramentas/gerar-fotos-rua.mjs "$MODO" public/dados/linhas.json public/dados/fotos-de-rua.json

      # Sem o geradoEm e com as chaves por ordem; um ficheiro em falta ou estragado no ar conta como mudança.
      - name: Compare with the live files
        id: compara
        shell: bash
        working-directory: worker
        run: |
          mudou=nao
          for ficheiro in linhas.json fotos-de-rua.json; do
            jq -S 'del(.geradoEm)' "public/dados/$ficheiro" > "$RUNNER_TEMP/novo.json"
            curl -fsSL --retry 2 -o "$RUNNER_TEMP/no-ar.json" "https://paragemcerta.pixellusitano.com/dados/$ficheiro" || echo '{}' > "$RUNNER_TEMP/no-ar.json"
            jq -S 'del(.geradoEm)' "$RUNNER_TEMP/no-ar.json" > "$RUNNER_TEMP/antigo.json" || echo '{}' > "$RUNNER_TEMP/antigo.json"
            if ! cmp -s "$RUNNER_TEMP/novo.json" "$RUNNER_TEMP/antigo.json"; then mudou=sim; fi
          done
          echo "mudou=$mudou" >> "$GITHUB_OUTPUT"
          if [ "$mudou" = nao ]; then echo "O catálogo e as fotos não mudaram; nada a publicar."; fi

      # O mesmo deploy (e os mesmos segredos) do "Servidor"; sem migrações, porque este commit já foi publicado.
      - name: Deploy the Worker with the new files
        if: steps.compara.outputs.mudou == 'sim'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            RESEND_API_KEY
            RESPONSAVEL
            GOOGLE_WEB_CLIENT_ID
            CF_PURGE_TOKEN
            CF_ZONA
            EMAIL_AUTOR
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESPONSAVEL: ${{ secrets.RESPONSAVEL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          CF_ZONA: ${{ secrets.CF_ZONA }}
          EMAIL_AUTOR: ${{ secrets.EMAIL_AUTOR }}
