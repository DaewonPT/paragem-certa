# .github/workflows/android.yml
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: Gravar de novo as capturas de referência do Roborazzi (ficam num artefacto para descarregar e fazer commit)
        type: boolean
        default: false

# Least privilege: everything is read-only unless a job asks for more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build, lint and test
    # Fixed image (not ubuntu-latest): Roborazzi goldens depend on the OS that renders them.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Also validates gradle-wrapper.jar. "basic" = MIT cache on top of actions/cache (no closed-source component).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test, screenshot check, lint and debug APK
        env:
          RECORD: ${{ inputs.record_screenshots }}
        run: |
          if [ "$RECORD" = "true" ]; then
            SHOTS=:app:recordRoborazziPessoalDebug
          elif [ -d app/src/test/screenshots ]; then
            SHOTS=:app:verifyRoborazziPessoalDebug
          else
            SHOTS=
            echo "::warning::Sem capturas de referência em app/src/test/screenshots. Corre este workflow à mão com 'record_screenshots' ligado."
          fi
          ./gradlew --stacktrace \
            :core:test \
            :app:testPessoalDebugUnitTest \
            $SHOTS \
            :app:lintPessoalDebug \
            :app:assemblePessoalDebug

      # Spec 11: os serviços (viagem e avisos de chegada) e as permissões do manifesto fundido não podem mudar sem ninguém ver.
      - name: Check merged manifest (trip and arrival-alert services, permissions)
        run: |
          MANIFESTO=$(find app/build/intermediates/merged_manifests/pessoalDebug -name AndroidManifest.xml)
          [ -f "$MANIFESTO" ] || { echo "::error::Sem manifesto fundido da variante pessoal"; exit 1; }
          python3 - "$MANIFESTO" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          A = "{http://schemas.android.com/apk/res/android}"
          raiz = ET.parse(sys.argv[1]).getroot()
          permissoes = {p.get(A + "name") for p in raiz if p.tag.startswith("uses-permission")}
          servicos = [s for s in raiz.iter("service") if (s.get(A + "name") or "").endswith(".viagem.ServicoViagem")]
          avisos = [s for s in raiz.iter("service") if (s.get(A + "name") or "").endswith(".aviso.ServicoAvisoChegada")]
          erros = []
          for nome in ("FOREGROUND_SERVICE_LOCATION", "FOREGROUND_SERVICE_SPECIAL_USE", "POST_NOTIFICATIONS"):
              if "android.permission." + nome not in permissoes:
                  erros.append("falta a permissão " + nome)
          for nome in ("ACCESS_BACKGROUND_LOCATION", "USE_FULL_SCREEN_INTENT", "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"):
              if "android.permission." + nome in permissoes:
                  erros.append("a permissão " + nome + " não pode existir")
          if len(servicos) != 1:
              erros.append("devia haver um só ServicoViagem e há %d" % len(servicos))
          else:
              for atributo, esperado in (("foregroundServiceType", "location"), ("process", ":trip")):
                  if servicos[0].get(A + atributo) != esperado:
                      erros.append("ServicoViagem: %s devia ser %s e é %s" % (atributo, esperado, servicos[0].get(A + atributo)))
          if len(avisos) != 1:
              erros.append("devia haver um só ServicoAvisoChegada e há %d" % len(avisos))
          else:
              if avisos[0].get(A + "foregroundServiceType") != "specialUse":
                  erros.append("ServicoAvisoChegada: foregroundServiceType devia ser specialUse e é %s" % avisos[0].get(A + "foregroundServiceType"))
              subtipos = [p.get(A + "value") for p in avisos[0].iter("property") if p.get(A + "name") == "android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"]
              if not any(subtipos):
                  erros.append("ServicoAvisoChegada: falta a propriedade PROPERTY_SPECIAL_USE_FGS_SUBTYPE com valor")
          for e in erros:
              print("::error::" + e)
          sys.exit(1 if erros else 0)
          PY

      - name: Upload recorded screenshots
        if: inputs.record_screenshots
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-goldens
          path: app/src/test/screenshots/
          if-no-files-found: error

      - name: Upload reports (tests, lint, screenshot diffs)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/
            app/build/outputs/roborazzi/
          retention-days: 14

  release:
    name: Signed APK to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # only this job may create the Release and upload the APK
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta o segredo ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --stacktrace :app:assemblePessoalRelease

      - name: Verify signature and attach APK to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          APK="paragem-certa-$TAG.apk"
          # A nota desta versão (secção "## X.Y.Z" do PATCHNOTES.md, sem os ** do markdown) é o que o aviso
          # de atualização mostra no telemóvel; sem secção, ficam as notas automáticas.
          awk -v v="${TAG#v}" '/^## /{ativo = (index($0, "## " v " ") == 1); next} ativo && (texto || $0 != "") {texto = 1; gsub(/\*\*/, ""); print}' PATCHNOTES.md > notas.md
          # Unsigned builds are named app-pessoal-release-unsigned.apk, so this cp also fails if signing was skipped.
          cp app/build/outputs/apk/pessoal/release/app-pessoal-release.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            if [ -s notas.md ]; then NOTAS=(--notes-file notas.md); else NOTAS=(--generate-notes); fi
            gh release create "$TAG" "$APK" --title "$TAG" "${NOTAS[@]}" --verify-tag
          fi
