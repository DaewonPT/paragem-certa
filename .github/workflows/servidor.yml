# .github/workflows/servidor.yml
# Testa o servidor (worker/). Só publica quando o autor corre o workflow à mão (ver docs/servidor.md).
name: Servidor

on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/servidor.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/servidor.yml'
  workflow_dispatch:

# Least privilege: everything is read-only unless a job asks for more.
permissions:
  contents: read

# A concorrência é por job: um push novo cancela os testes antigos, mas nunca um "publicar" a meio.
jobs:
  testes:
    name: Tests and types
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Tests (local D1, nothing leaves the runner)
        run: npm test

      - name: Types
        run: npm run tipos

      - name: Data generators (Node, small hand-written data)
        run: npm run ferramentas

  publicar:
    name: Publish to Cloudflare
    # Só à mão (Actions → Servidor → Run workflow) e só a partir do main. Os passos do autor estão em docs/servidor.md.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # Os testes e os tipos têm de passar antes de qualquer coisa sair daqui.
    needs: testes
    # O mesmo grupo do dados.yml: uma publicação espera pela atualização semanal do catálogo (e vice-versa), sem
    # cancelar nenhuma a meio.
    concurrency:
      group: publicar-servidor
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies (exact versions from package-lock.json)
        working-directory: worker
        run: npm ci

      # O linhas.json nunca vai para o repositório: gera-se aqui, dos GTFS processados pelo Transitous (os mesmos passos
      # do dados.yml), antes de mexer em alguma coisa na Cloudflare. Se o Transitous falhar, fica a cópia que está no ar.
      - name: Generate the lines catalogue from Transitous
        id: linhas
        continue-on-error: true
        shell: bash
        working-directory: worker
        env:
          UA: 'ParagemCerta/0.4.0 (contact@pixellusitano.com; https://pixellusitano.com)'
        run: |
          gtfs="$RUNNER_TEMP/gtfs"
          mkdir -p "$gtfs"
          jq -r '.[] | [.feed, .url] | @tsv' ferramentas/feeds-linhas.json | while IFS=$'\t' read -r feed url; do
            curl -fsSL --retry 2 -A "$UA" -o "$RUNNER_TEMP/feed.zip" "$url"
            unzip -q -o "$RUNNER_TEMP/feed.zip" -d "$gtfs/$feed"
          done
          node ferramentas/gerar-linhas.mjs "$gtfs" public/dados/linhas.json

      # Sem nenhuma das duas (a primeira publicação com o Transitous em baixo), pára aqui.
      - name: Keep the live lines catalogue (Transitous failed)
        if: steps.linhas.outcome == 'failure'
        shell: bash
        working-directory: worker
        run: |
          curl -fsSL --retry 2 -o public/dados/linhas.json https://paragemcerta.pixellusitano.com/dados/linhas.json
          jq -e '.versao == 1 and (.linhas | length) > 0' public/dados/linhas.json > /dev/null

      # Um deploy apaga do ar o que não leva: copia as fotos de rua que lá estão e só gera se não houver nenhumas. Uma
      # falha do Panoramax não pára a publicação.
      - name: Keep the live street photos
        working-directory: worker
        run: node ferramentas/gerar-fotos-rua.mjs manter public/dados/linhas.json public/dados/fotos-de-rua.json

      # As migrações vão primeiro: só acrescentam tabelas, por isso o código antigo continua a funcionar até ao deploy.
      - name: Apply D1 migrations (remote, EU)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply DB --remote

      - name: Deploy the Worker and its secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            RESEND_API_KEY
            RESPONSAVEL
            GOOGLE_WEB_CLIENT_ID
            EMAIL_AUTOR
            CHAVE_MARCA_EMAIL
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESPONSAVEL: ${{ secrets.RESPONSAVEL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          EMAIL_AUTOR: ${{ secrets.EMAIL_AUTOR }}
          CHAVE_MARCA_EMAIL: ${{ secrets.CHAVE_MARCA_EMAIL }}

      # O pc-admin (a página de revisão) é outro Worker, com a sua configuração. Vai pelo wrangler do projeto (versão
      # fixa no package-lock), sempre com `-c wrangler.admin.jsonc`, para o código e os segredos nunca irem parar ao
      # Worker principal. Um segredo em falta pára tudo aqui, em vez de apagar o valor que já lá está.
      - name: Upload the pc-admin secrets
        shell: bash
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ACCESS_EQUIPA: ${{ secrets.ACCESS_EQUIPA }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          EMAIL_AUTOR: ${{ secrets.EMAIL_AUTOR }}
          CHAVE_MARCA_EMAIL: ${{ secrets.CHAVE_MARCA_EMAIL }}
        run: |
          node -e '
            const nomes = ["RESEND_API_KEY", "ACCESS_EQUIPA", "ACCESS_AUD", "EMAIL_AUTOR", "CHAVE_MARCA_EMAIL"];
            const segredos = {};
            for (const nome of nomes) {
              if (!process.env[nome]) throw new Error(`falta o segredo ${nome} no GitHub`);
              segredos[nome] = process.env[nome];
            }
            process.stdout.write(JSON.stringify(segredos));
          ' | npx wrangler secret bulk -c wrangler.admin.jsonc

      - name: Deploy pc-admin
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler.admin.jsonc
